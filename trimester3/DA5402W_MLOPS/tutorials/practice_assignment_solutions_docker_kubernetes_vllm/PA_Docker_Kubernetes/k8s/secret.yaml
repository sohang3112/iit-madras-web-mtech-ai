# Sensitive configuration for the diabetes-api pods.
#
# `stringData` is used here (instead of `data`) purely for readability in this
# teaching example: Kubernetes base64-encodes it into `data` automatically on
# apply. In a real environment, do NOT commit real secrets to git — generate
# this manifest at deploy time (e.g. `kubectl create secret generic ... --from-literal=API_KEY=$SECRET`)
# or manage it with a secrets tool (Sealed Secrets, Vault, SOPS, etc).
apiVersion: v1
kind: Secret
metadata:
  name: diabetes-api-secret
  labels:
    app: diabetes-api
type: Opaque
stringData:
  API_KEY: "change-me-super-secret-key"
