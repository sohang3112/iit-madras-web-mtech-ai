# Exposes the diabetes-api Deployment inside (and, via NodePort, outside) the cluster.
# NodePort is used so the API is trivially reachable from the host in a local
# minikube/kind setup without needing an Ingress controller.
apiVersion: v1
kind: Service
metadata:
  name: diabetes-api-service
  labels:
    app: diabetes-api
spec:
  type: NodePort
  selector:
    app: diabetes-api
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
      name: http
