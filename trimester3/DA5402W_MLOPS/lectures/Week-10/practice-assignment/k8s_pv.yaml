apiVersion: v1
kind: PersistentVolume
metadata:
  name: ml-app-model-cache-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-app-model-cache-pvc
  namespace: ml-app
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
