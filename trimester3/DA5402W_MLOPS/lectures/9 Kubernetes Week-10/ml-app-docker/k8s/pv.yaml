apiVersion: v1
kind: PersistentVolume
metadata:
  name: ml-app-model-cache-pv
  labels:
    app.kubernetes.io/name: ml-app
    app.kubernetes.io/component: storage
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/ml-app-model-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-app-model-cache-pvc
  namespace: ml-app
  labels:
    app.kubernetes.io/name: ml-app
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
